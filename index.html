<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherGPT â€” Weather & Disaster Detection Assistant (SIH26068)</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --accent: #38bdf8;
      --bg-gradient: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 50%, #7dd3fc 100%);
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.96);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --user-bubble: #0284c7;
      --assistant-bubble: #f8fafc;
      --card-bg: #f0f9ff;
      --card-border: #bae6fd;
      --shadow-lg: 0 20px 35px -5px rgba(14, 165, 233, 0.25), 0 10px 15px -5px rgba(0, 0, 0, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text-main);
    }

    .app-card {
      width: 100%;
      max-width: 880px;
      height: 92vh;
      max-height: 890px;
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    header {
      padding: 16px 24px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
    }

    .brand-meta h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sih-badge {
      font-size: 0.7rem;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #bae6fd;
      letter-spacing: 0.5px;
    }

    .disaster-badge-header {
      font-size: 0.7rem;
      font-weight: 700;
      background: #fee2e2;
      color: #b91c1c;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #fca5a5;
      animation: pulse-red-badge 2s infinite;
    }

    @keyframes pulse-red-badge {
      0% { opacity: 0.8; }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.8; }
    }

    .brand-meta p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .lang-selector-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--border-color);
    }

    .lang-selector-wrap span {
      font-size: 1rem;
    }

    .lang-select {
      background: transparent;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .lang-select option {
      background: #ffffff;
      color: var(--text-main);
    }

    .toggle-lbl {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .toggle-lbl input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .quick-chips-bar {
      padding: 10px 24px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .quick-chips-bar span {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .chips-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .chip-btn:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
      border-color: #bae6fd;
      transform: translateY(-1px);
    }

    .chip-btn.disaster-chip {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
      font-weight: 600;
    }

    .chip-btn.disaster-chip:hover {
      background: #fee2e2;
      border-color: #f87171;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      width: 100%;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .bubble.user {
      background: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }

    .bubble.assistant {
      background: var(--assistant-bubble);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .weather-card {
      margin-top: 12px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      font-size: 0.85rem;
    }

    .weather-stat {
      display: flex;
      flex-direction: column;
    }

    .weather-stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .weather-stat-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-top: 2px;
    }

    .disaster-alert-card {
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .disaster-alert-card.danger {
      background: #fef2f2;
      border: 2px solid #ef4444;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.15);
    }

    .disaster-alert-card.warning {
      background: #fffbeb;
      border: 2px solid #f59e0b;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.12);
    }

    .disaster-alert-card.safe {
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      color: #166534;
      font-weight: 600;
    }

    .disaster-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .disaster-header-icon {
      font-size: 1.6rem;
      animation: alert-shake 2.5s infinite;
    }

    @keyframes alert-shake {
      0%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(-10deg); }
      20%, 40% { transform: rotate(10deg); }
      50% { transform: rotate(0deg); }
    }

    .disaster-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .disaster-tag {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: inline-block;
      width: fit-content;
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 2px;
    }

    .disaster-alert-card.danger .disaster-tag {
      background: #ef4444;
      color: #ffffff;
    }

    .disaster-alert-card.warning .disaster-tag {
      background: #f59e0b;
      color: #ffffff;
    }

    .disaster-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .disaster-alert-card.danger .disaster-title {
      color: #991b1b;
    }

    .disaster-alert-card.warning .disaster-title {
      color: #92400e;
    }

    .disaster-details {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #334155;
    }

    .disaster-advisory {
      margin-top: 4px;
      font-weight: 600;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .disaster-alert-card.danger .disaster-advisory {
      color: #b91c1c;
    }

    .disaster-alert-card.warning .disaster-advisory {
      color: #b45309;
    }

    .thinking-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 20px;
    }

    .thinking-bubble span {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      animation: dot-bounce 1.4s infinite ease-in-out both;
    }

    .thinking-bubble span:nth-child(1) { animation-delay: -0.32s; }
    .thinking-bubble span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    footer {
      padding: 16px 24px;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
    }

    .input-form {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 14px 20px;
      font-size: 0.95rem;
      border: 1.5px solid var(--border-color);
      border-radius: 999px;
      outline: none;
      background: #f8fafc;
      color: var(--text-main);
      transition: all 0.2s;
    }

    .chat-input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
    }

    .btn-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-mic {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-mic:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .btn-mic.recording {
      background: #ef4444;
      color: #ffffff;
      border-color: #dc2626;
      animation: pulse-red 1.5s infinite;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .btn-send {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
    }

    .btn-send:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-send:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-circle svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .status-line {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
      padding-left: 14px;
      min-height: 16px;
    }

    @media (max-width: 640px) {
      body { padding: 0; }
      .app-card {
        height: 100vh;
        max-height: none;
        border-radius: 0;
      }
      header { padding: 12px 16px; }
      .chat-messages { padding: 16px; }
      .bubble { max-width: 92%; }
      footer { padding: 12px 16px; }
    }
  </style>
</head>

    function detectLanguage(text) {
      if (!text) return currentLang;
      if (/[\u0C00-\u0C7F]/.test(text)) return 'te';
      if (/[\u0900-\u097F]/.test(text)) return 'hi';
      if (/[\u0C80-\u0CFF]/.test(text)) return 'kn';

      const lower = text.toLowerCase();
      if (/\b(ela\s+undi|ela\s+undhi|eela\s+undi|varsham|vaathavaranam|vatavaranam|lo\s+weather|lo\s+ela|cheppandi|cheppu|yela\s+undi|vipathu|tufaanu|varadalu)\b/i.test(lower)) {
        return 'te';
      }
      if (/\b(kaisa\s+hai|kaisi\s+hai|mausam|kya\s+hai|bataye|batao|barish|tapman|aapda|toofan)\b/i.test(lower)) {
        return 'hi';
      }
      if (/\b(hegide|hegidhe|havamana|thilisi|tilisi|male\s+barutha|nalli\s+weather|vipattu)\b/i.test(lower)) {
        return 'kn';
      }
      return currentLang;
    }

    function setLanguage(lang, updateBubble = false) {
      currentLang = lang;
      langSelect.value = lang;
      const dict = I18N[lang] || I18N.en;

      headerTagline.textContent = dict.tagline;
      ttsLabelText.textContent = dict.readAloud;
      quickCheckLabel.textContent = dict.quickCheck;
      queryInput.placeholder = dict.placeholder;

      renderQuickChips(dict);

      if (updateBubble && welcomeMessageBubble) {
        welcomeMessageBubble.innerHTML = dict.welcomeHtml;
      }

      if (recognition) {
        recognition.lang = dict.code;
      }
    }

    function renderQuickChips(dict) {
      chipsContainer.innerHTML = '';

      const locBtn = document.createElement('button');
      locBtn.className = 'chip-btn';
      locBtn.textContent = dict.currentLocation;
      locBtn.onclick = useCurrentLocation;
      chipsContainer.appendChild(locBtn);

      const disasterBtn = document.createElement('button');
      disasterBtn.className = 'chip-btn disaster-chip';
      disasterBtn.textContent = dict.disasterRadarChip;
      disasterBtn.onclick = checkCurrentDisasterRisk;
      chipsContainer.appendChild(disasterBtn);

      dict.cities.forEach(city => {
        const btn = document.createElement('button');
        btn.className = 'chip-btn';
        btn.textContent = city.label;
        btn.onclick = () => sendQuickQuery(city.query);
        chipsContainer.appendChild(btn);
      });
    }

    function scrollBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addMessage(role, contentHtml) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;
      bubble.innerHTML = contentHtml;

      row.appendChild(bubble);
      chatContainer.appendChild(row);
      scrollBottom();
      return bubble;
    }

    function showThinking() {
      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.id = 'thinkingRow';

      const bubble = document.createElement('div');
      bubble.className = 'bubble assistant thinking-bubble';
      bubble.innerHTML = '<span></span><span></span><span></span>';

      row.appendChild(bubble);
      chatContainer.appendChild(row);
      scrollBottom();
    }

    function hideThinking() {
      const row = document.getElementById('thinkingRow');
      if (row) row.remove();
    }

    function speak(text, lang = currentLang) {
      if (!('speechSynthesis' in window) || !ttsCheckbox.checked) return;
      window.speechSynthesis.cancel();

      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(geocodeName)}&count=1&language=en&format=json`;
        const geoRes = await fetch(geoUrl);
        if (geoRes.ok) {
          const geoData = await geoRes.json();
          if (geoData.results && geoData.results.length > 0) {
            const p = geoData.results[0];
            lat = p.latitude;
            lon = p.longitude;
            placeDisplayName = [original, p.country].filter(Boolean).join(', ');
          }
        }
      } catch (e) {
        console.warn('Geocoding fallback:', e);
      }

      if (!lat || !lon) {
        try {
          const nomUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(original)}&format=json&limit=1`;
          const nomRes = await fetch(nomUrl, { headers: { 'Accept-Language': `${lang},en` } });
          if (nomRes.ok) {
            const nomData = await nomRes.json();
            if (nomData && nomData.length > 0) {
              lat = parseFloat(nomData[0].lat);
              lon = parseFloat(nomData[0].lon);
              placeDisplayName = nomData[0].name || original;
            }
          }
        } catch (e) {
          console.warn('Nominatim error:', e);

      }

      if (!lat || !lon) {
        return { error: 'not_found', location: original };

      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;

          te: 'à°ªà±à°°à°¸à±à°¤à±à°¤à°‚ à°Žà°²à°¾à°‚à°Ÿà°¿ à°µà°¿à°ªà°¤à±à°¤à± à°®à±à°ªà±à°ªà± à°²à±‡à°¦à±. à°µà°¾à°¤à°¾à°µà°°à°£à°‚ à°¸à°¾à°§à°¾à°°à°£à°‚à°—à°¾ à°®à°°à°¿à°¯à± à°¸à±à°°à°•à±à°·à°¿à°¤à°‚à°—à°¾ à°‰à°‚à°¦à°¿.',
          en: 'No disaster risks detected. Weather conditions are safe and normal.',
          hi: 'à¤«à¤¿à¤²à¤¹à¤¾à¤² à¤•à¥‹à¤ˆ à¤ªà¥à¤°à¤¾à¤•à¥ƒà¤¤à¤¿à¤• à¤†à¤ªà¤¦à¤¾ à¤•à¤¾ à¤–à¤¤à¤°à¤¾ à¤¨à¤¹à¥€à¤‚ à¤¹à¥ˆà¥¤ à¤®à¥Œà¤¸à¤® à¤¸à¥à¤°à¤•à¥à¤·à¤¿à¤¤ à¤”à¤° à¤¸à¤¾à¤®à¤¾à¤¨à¥à¤¯ à¤¹à¥ˆà¥¤',
          kn: 'à²ªà³à²°à²¸à³à²¤à³à²¤ à²¯à²¾à²µà³à²¦à³‡ à²µà²¿à²ªà²¤à³à²¤à²¿à²¨ à²…à²ªà²¾à²¯à²µà²¿à²²à³à²². à²¹à²µà²¾à²®à²¾à²¨ à²¸à³à²°à²•à³à²·à²¿à²¤à²µà²¾à²—à²¿à²¦à³†.'
        }[lang] || 'No disaster risks detected.';

        disasterHtml = `
          <div class="disaster-alert-card safe">
            <span style="font-size: 1.4rem;">ðŸ›¡ï¸</span>
            <span><strong>à°µà°¿à°ªà°¤à±à°¤à± à°¸à±à°¥à°¿à°¤à°¿ (Disaster Status):</strong> ${safeText}</span>
          </div>
        `;
      }

      return {
        speechText: speechText + disasterAlertSpeech,
        htmlText: `${htmlText}${cardHtml}${disasterHtml}`

    }

    async function handleUserQuery(query) {
      if (!query || !query.trim()) return;
      const cleanQuery = query.trim();

      const targetLang = detectLanguage(cleanQuery);
      if (targetLang !== currentLang) {
        setLanguage(targetLang);
      }

      const dict = I18N[targetLang] || I18N.en;

      addMessage('user', cleanQuery);
      queryInput.value = '';
      queryInput.disabled = true;
      sendButton.disabled = true;
      micButton.disabled = true;
      statusMsg.textContent = dict.checkingWeather;

      showThinking();

      try {
        const lower = cleanQuery.toLowerCase();
        const greetings = ['hi', 'hello', 'hey', 'à°¨à°®à°¸à±à°•à°¾à°°à°‚', 'à°¨à°®à°¸à±à°¤à±‡', 'à°¬à°¾à°—à±à°¨à±à°¨à°¾à°°à°¾', 'à°¹à°²à±‹', 'à¤¨à¤®à¤¸à¥à¤¤à¥‡', 'à¤¨à¤®à¤¸à¥à¤•à¤¾à¤°', 'à²¹à²²à³‹', 'à²¨à²®à²¸à³à²•à²¾à²°'];
        if (greetings.some(g => lower.startsWith(g) || lower === g) && !cleanQuery.includes('weather') && !cleanQuery.includes('à°µà°¾à°¤à°¾à°µà°°à°£à°‚') && !cleanQuery.includes('à°µà°¿à°ªà°¤à±à°¤à±') && !cleanQuery.includes('à°¤à±à°«à°¾à°¨à±') && !cleanQuery.includes('disaster')) {
          hideThinking();
          addMessage('assistant', dict.greetingHtml);
          speak(dict.greetingSpeech, targetLang);
          statusMsg.textContent = '';
          return;
        }

        const locObj = extractLocation(cleanQuery);
        if (!locObj || !locObj.original) {
          hideThinking();
          addMessage('assistant', dict.askLocationHtml);
          speak(dict.askLocationSpeech, targetLang);
          statusMsg.textContent = '';
          return;
        }

        const weatherData = await fetchRealWeather(locObj, targetLang);
        hideThinking();
        const reply = generateConversationalReply(weatherData, targetLang);
        addMessage('assistant', reply.htmlText);
        speak(reply.speechText, targetLang);
        statusMsg.textContent = '';
      } catch (err) {
        hideThinking();
        console.error('Weather error:', err);
        const errMsg = targetLang === 'te'
          ? 'âš ï¸ à°•à±à°·à°®à°¿à°‚à°šà°‚à°¡à°¿, à°¤à°¾à°œà°¾ à°µà°¾à°¤à°¾à°µà°°à°£ à°µà°¿à°µà°°à°¾à°²à°¨à± à°ªà±Šà°‚à°¦à°²à±‡à°•à°ªà±‹à°¯à°¾à°®à±. à°¦à°¯à°šà±‡à°¸à°¿ à°®à±€ à°‡à°‚à°Ÿà°°à±à°¨à±†à°Ÿà± à°•à°¨à±†à°•à±à°·à°¨à±â€Œà°¨à°¿ à°ªà°°à°¿à°¶à±€à°²à°¿à°‚à°šà°‚à°¡à°¿.'
          : 'âš ï¸ Sorry, unable to retrieve weather data right now. Please check your internet connection.';
        addMessage('assistant', errMsg);
        statusMsg.textContent = '';
      } finally {
        queryInput.disabled = false;
        sendButton.disabled = false;
        micButton.disabled = false;
        queryInput.focus();
      }
    }

    function sendQuickQuery(text) {
      handleUserQuery(text);
    }

    function checkCurrentDisasterRisk() {
      useCurrentLocation(true);
    }

    function useCurrentLocation(isDisasterCheck = false) {
      const dict = I18N[currentLang] || I18N.en;
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }
      statusMsg.textContent = dict.checkingWeather;
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          showThinking();
          try {
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
            const weatherRes = await fetch(weatherUrl);
            const weatherData = await weatherRes.json();
            const current = weatherData.current;
            const daily = weatherData.daily;
            const code = current.weather_code;
            const codeInfo = weatherCodesI18n[code] || { te: 'à°ªà°¾à°•à±à°·à°¿à°•à°‚à°—à°¾ à°®à±‡à°˜à°¾à°µà±ƒà°¤à°‚', en: 'Partly cloudy', hi: 'à¤¹à¤²à¥à¤•à¥‡ à¤¬à¤¾à¤¦à¤²', kn: 'à²­à²¾à²—à²¶à²ƒ à²®à³‹à²¡ à²•à²µà²¿à²¦à²¿à²¦à³†', icon: 'â›…' };

            const locTitle = {
              te: 'à°®à±€ à°ªà±à°°à°¸à±à°¤à±à°¤ à°ªà±à°°à°¾à°‚à°¤à°‚',
              en: 'Your Current Location',
              hi: 'à¤†à¤ªà¤•à¤¾ à¤µà¤°à¥à¤¤à¤®à¤¾à¤¨ à¤¸à¥à¤¥à¤¾à¤¨',
              kn: 'à²¨à²¿à²®à³à²® à²ªà³à²°à²¸à³à²¤à³à²¤ à²¸à³à²¥à²³'
            }[currentLang] || 'Your Current Location';

            const result = {
              location: locTitle,
              temp: Math.round(current.temperature_2m),
              feelsLike: Math.round(current.apparent_temperature),
              humidity: current.relative_humidity_2m,
              wind: Math.round(current.wind_speed_10m),
              precipitation: current.precipitation,
              weatherCode: code,
              weatherDesc: codeInfo[currentLang] || codeInfo.en,
              weatherIcon: codeInfo.icon,
              tempMax: daily && daily.temperature_2m_max ? Math.round(daily.temperature_2m_max[0]) : null,
              tempMin: daily && daily.temperature_2m_min ? Math.round(daily.temperature_2m_min[0]) : null,
            };

            hideThinking();
            addMessage('user', isDisasterCheck ? `ðŸš¨ ${locTitle} à°µà°¿à°ªà°¤à±à°¤à± à°¤à°¨à°¿à°–à±€ (Disaster Scan)` : `ðŸ“ ${locTitle}`);
            const reply = generateConversationalReply(result, currentLang);
            addMessage('assistant', reply.htmlText);
            speak(reply.speechText, currentLang);
            statusMsg.textContent = '';
          } catch (e) {
            hideThinking();
            alert('Failed to fetch weather for current location.');
            statusMsg.textContent = '';
          }
        },
        (err) => {
          statusMsg.textContent = '';
          alert(`Location access denied: ${err.message}`);
        }
      );
    }

    langSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      setLanguage(selected, true);
      const dict = I18N[selected];
      speak(dict.welcomeSpeech, selected);
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleUserQuery(queryInput.value);
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = I18N[currentLang].code;

      recognition.onstart = () => {
        isListening = true;
        micButton.classList.add('recording');
        statusMsg.textContent = I18N[currentLang].micListening;
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text) {
          queryInput.value = text;
          handleUserQuery(text);
        }
      };

      recognition.onerror = (e) => {
        console.warn('Speech recognition error:', e.error);
        statusMsg.textContent = `${I18N[currentLang].micError} ${e.error}`;
      };

      recognition.onend = () => {
        isListening = false;
        micButton.classList.remove('recording');
        if (statusMsg.textContent.startsWith('ðŸŽ¤')) {
          statusMsg.textContent = '';
        }
      };

      micButton.addEventListener('click', () => {
        if (isListening) {
          recognition.stop();
        } else {
          try {
            recognition.lang = I18N[currentLang].code;
            recognition.start();
          } catch (e) {
            console.error('Speech recognition start failed:', e);
          }
        }
      });
    } else {
      micButton.addEventListener('click', () => {
        alert('Voice input is not supported by your current browser. Please try Chrome, Edge, or Safari.');
      });
    }

    setLanguage('te', true);

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
